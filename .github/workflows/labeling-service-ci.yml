name: 标注接口回归
on:
  pull_request:
    branches: [backend]
    paths:
      - 'labeling-service/**'
      - 'docs/labeling-v1.1/**'
      - '.github/workflows/labeling-service-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labeling-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labeling-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PostgreSQL 迁移、权限、并发和 HTTP 全链路回归
        env:
          LABELING_NODE_E2E: 'true'
        run: mvn -B -ntp -f labeling-service/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labeling-test-results
          path: labeling-service/target/surefire-reports/
