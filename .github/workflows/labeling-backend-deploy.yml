name: 数据标注后端自动部署
on:
  push:
    branches: [backend, feat/backend_LS]
    paths:
      - 'labeling-service/**'
      - '.github/workflows/labeling-backend-deploy.yml'
  pull_request:
    branches: [backend]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labeling-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labeling-service/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 准备可离线安装的源码运行环境
        run: |
          python -m pip download --only-binary=:all: --require-hashes --dest labeling-service/target/ls-wheels -r labeling-service/ls-source-adapter/requirements.lock
          python -m venv labeling-service/target/ls-build-env
          labeling-service/target/ls-build-env/bin/python -m pip install --no-index --require-hashes --find-links labeling-service/target/ls-wheels -r labeling-service/ls-source-adapter/requirements.lock
          labeling-service/target/ls-build-env/bin/python labeling-service/scripts/runtime_check.py --adapter-root labeling-service/ls-source-adapter
      - name: 构建标注服务
        run: |
          mvn -B -ntp -f labeling-service/pom.xml \
            "-Dls.test.python=$PWD/labeling-service/target/ls-build-env/bin/python" \
            "-Dlabeling.ls-source.python=$PWD/labeling-service/target/ls-build-env/bin/python" \
            "-Dlabeling.ls-source.adapter-root=$PWD/labeling-service/ls-source-adapter" \
            verify
      - name: 发布边界测试
        run: |
          python -m unittest discover -s labeling-service/scripts -p 'test_*.py'
          bash -n labeling-service/deploy-release.sh labeling-service/scripts/install-private-python.sh
      - name: 打包并核对完整发布内容
        run: |
          python labeling-service/scripts/release_bundle.py build --jar labeling-service/target/tss-labeling-service-0.1.0-SNAPSHOT.jar --wheelhouse labeling-service/target/ls-wheels --revision "$GITHUB_SHA" --output labeling-service/target/labeling-release.tar.gz
          python labeling-service/scripts/release_bundle.py verify labeling-service/target/labeling-release.tar.gz --revision "$GITHUB_SHA" --destination labeling-service/target/release-check > /dev/null
          python -m venv labeling-service/target/release-check/venv
          labeling-service/target/release-check/venv/bin/python -m pip install --no-index --require-hashes --find-links labeling-service/target/release-check/wheels -r labeling-service/target/release-check/requirements.lock
          labeling-service/target/release-check/venv/bin/python labeling-service/target/release-check/release/runtime_check.py --adapter-root labeling-service/target/release-check/ls-source-adapter
      - uses: actions/upload-artifact@v4
        with:
          name: labeling-backend-release
          path: labeling-service/target/labeling-release.tar.gz
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: build
    if: github.repository == 'tssai-lab/tss-data-labeling' && github.ref == 'refs/heads/backend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: labeling-production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: labeling-backend-release
          path: labeling-service/target
      - name: 配置 SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" == 47.111.225.144 ]]
          [[ "$DEPLOY_USER" == root ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/labeling_deploy_key
          chmod 600 ~/.ssh/labeling_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host labeling-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/labeling_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
      - name: 确认部署版本仍是分支最新提交
        shell: bash
        run: |
          set -Eeuo pipefail
          current_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$current_sha" = "$GITHUB_SHA"
      - name: 上传并部署标注服务
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact=labeling-service/target/labeling-release.tar.gz
          test -s "$artifact"
          remote_bundle="/var/tmp/tss-labeling-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_tool="${remote_bundle%.tar.gz}-tool.py"
          digest="$(sha256sum "$artifact" | cut -d ' ' -f1)"
          scp "$artifact" "labeling-target:$remote_bundle"
          scp labeling-service/scripts/release_bundle.py "labeling-target:$remote_tool"
          ssh labeling-target bash -s -- "$remote_bundle" "$digest" "$GITHUB_SHA" "$remote_tool" \
            < labeling-service/deploy-release.sh
          echo "已部署标注后端提交：$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
