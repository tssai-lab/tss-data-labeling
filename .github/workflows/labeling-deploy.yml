name: 数据标注后端自动部署
on:
  push:
    branches: [backend]
    paths:
      - 'labeling-service/**'
      - '.github/workflows/labeling-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labeling-production-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'tssai-lab/tss-data-labeling' && github.ref == 'refs/heads/backend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: labeling-production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labeling-service/pom.xml
      - name: 构建标注服务
        run: mvn -B -ntp -f labeling-service/pom.xml verify
      - name: 配置 SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" == 47.111.225.144 ]]
          [[ "$DEPLOY_USER" == root ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/labeling_deploy_key
          chmod 600 ~/.ssh/labeling_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host labeling-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/labeling_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
      - name: 确认部署版本仍是分支最新提交
        shell: bash
        run: |
          set -Eeuo pipefail
          current_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$current_sha" = "$GITHUB_SHA"
      - name: 上传并部署标注服务
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact=labeling-service/target/tss-labeling-service-0.1.0-SNAPSHOT.jar
          test -s "$artifact"
          remote_jar="/var/tmp/tss-labeling-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"
          digest="$(sha256sum "$artifact" | cut -d ' ' -f1)"
          scp "$artifact" "labeling-target:$remote_jar"
          ssh labeling-target bash -s -- "$remote_jar" "$digest" "$GITHUB_SHA" \
            < labeling-service/deploy-release.sh
          echo "已部署标注后端提交：$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
