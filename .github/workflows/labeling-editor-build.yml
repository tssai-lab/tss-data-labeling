name: 标注编辑器资源与后端构建验证
on:
  pull_request:
    branches: [backend]
    paths:
      - 'labeling-service/**'
      - '.github/workflows/labeling-editor-build.yml'
  push:
    branches: [feat/backend-label-studio-integration]
    paths:
      - 'labeling-service/**'
      - '.github/workflows/labeling-editor-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labeling-service/pom.xml
      - name: 从干净源码构建并测试
        run: mvn -B -ntp -f labeling-service/pom.xml clean verify
      - name: 校验最终JAR中的编辑器资源
        run: python3 labeling-service/scripts/verify-editor-artifact.py labeling-service/target/tss-labeling-service-0.1.0-SNAPSHOT.jar
