spring:
  application:
    name: tss-labeling-service
  datasource:
    url: ${LABELING_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/tss_labeling?currentSchema=labeling}
    username: ${LABELING_DATABASE_USERNAME:tss_labeling_app}
    password: ${LABELING_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${LABELING_MIGRATION_USERNAME:tss_labeling_owner}
    password: ${LABELING_MIGRATION_PASSWORD}
    default-schema: labeling
    schemas: labeling
    locations: classpath:db/migration
    # 专用库必须从明确的迁移历史开始，不自动接管已有业务表。
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

server:
  # 第一轮本地开发仅允许本机访问，端口可通过环境变量调整。
  address: ${LABELING_BIND_ADDRESS:127.0.0.1}
  port: ${LABELING_PORT:8082}

labeling:
  imports:
    # 独立持久化目录，部署时挂载；不要使用训练平台数据卷。
    storage-root: ${LABELING_STORAGE_ROOT:./data/labeling}
    chunk-size-bytes: ${LABELING_CHUNK_SIZE_BYTES:4194304}
    max-archive-bytes: ${LABELING_MAX_ARCHIVE_BYTES:2147483648}
    max-expanded-bytes: ${LABELING_MAX_EXPANDED_BYTES:8589934592}
    max-file-bytes: ${LABELING_MAX_FILE_BYTES:67108864}
    max-entries: ${LABELING_MAX_ENTRIES:100000}
    max-pixels: ${LABELING_MAX_PIXELS:40000000}
    max-errors: ${LABELING_MAX_ERRORS:1000}
    zip-encoding: ${LABELING_ZIP_ENCODING:UTF-8}
    worker-enabled: ${LABELING_IMPORT_WORKER_ENABLED:true}
    poll-delay-ms: ${LABELING_IMPORT_POLL_DELAY_MS:1000}
  identity:
    base-url: ${LABELING_IDENTITY_BASE_URL:http://127.0.0.1:8080}
